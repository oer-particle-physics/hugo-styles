name: Deploy docs site

on:
  push:
    # Trigger branch pushes so the job can compare against the repository's
    # current default branch. Defining only branches also excludes tag pushes.
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    if: >-
      github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/reusable-pages.yml
    with:
      site-root: .
      go-version-file: go.mod
      hugo-config: "hugo.toml,hugo-docs.toml"
      setup-node: true
      node-version: "22"
      prepare-command: |
        npm ci
        npx playwright install --with-deps chromium
        npm run check:flexsearch
        npm run check:medium-zoom
        hugo mod tidy
        python3 -m unittest discover -s scripts/tests -v
        (cd cmd/hugo-styles-migrate && go test ./... && go vet ./...)
      validation-command: |
        (cd cmd/hugo-styles-migrate && go run . check ../..)
        hugo --config hugo.toml,hugo-docs.toml --panicOnWarning --destination .cache/current-site
        npm run test:browser
